name: Portable Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NOX_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nox-windows-x64
            binary: target/x86_64-pc-windows-msvc/release/nox.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: nox-windows-arm64
            binary: target/aarch64-pc-windows-msvc/release/nox.exe
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: nox-linux-x64
            binary: target/x86_64-unknown-linux-musl/release/nox
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: nox-linux-arm64
            binary: target/aarch64-unknown-linux-musl/release/nox
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: nox-macos-x64
            binary: target/x86_64-apple-darwin/release/nox
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: nox-macos-arm64
            binary: target/aarch64-apple-darwin/release/nox

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install musl tools
        if: contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        shell: bash
        run: cargo test --release --target "${{ matrix.target }}"

      - name: Build
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "stage/${{ matrix.artifact }}"
          cp "${{ matrix.binary }}" "stage/${{ matrix.artifact }}/"
          cp README.md PORTABLE.md INSTALL.md LICENSE "stage/${{ matrix.artifact }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag against Cargo version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as f:
              print(tomllib.load(f)['package']['version'])
          PY
          )"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          set -eu
          mkdir -p release

          for d in artifacts/*; do
            name="$(basename "$d")"
            if [[ "$name" == nox-windows-* ]]; then
              (cd "$d" && zip -9 -r "../../release/$name.zip" .)
            else
              tar -C "$d" -czf "release/$name.tar.gz" .
            fi

            case "$name" in
              nox-windows-x64)   cp "$d/nox.exe" "release/nox-windows-x64.exe" ;;
              nox-windows-arm64) cp "$d/nox.exe" "release/nox-windows-arm64.exe" ;;
              nox-linux-x64)     cp "$d/nox" "release/nox-linux-x64" ;;
              nox-linux-arm64)   cp "$d/nox" "release/nox-linux-arm64" ;;
              nox-macos-x64)     cp "$d/nox" "release/nox-macos-x64" ;;
              nox-macos-arm64)   cp "$d/nox" "release/nox-macos-arm64" ;;
            esac
          done

          sed "s|__NOX_REPOSITORY__|${GITHUB_REPOSITORY}|g" scripts/install/install.sh > release/install.sh
          sed "s|__NOX_REPOSITORY__|${GITHUB_REPOSITORY}|g" scripts/install/install.ps1 > release/install.ps1
          chmod +x release/install.sh

          printf '%s\n' "${GITHUB_REF_NAME#v}" > release/VERSION

          (
            cd release
            sha256sum * > SHA256SUMS
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
