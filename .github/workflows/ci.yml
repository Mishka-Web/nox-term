name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup component add clippy
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Tests
        run: cargo test
