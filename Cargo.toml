[package]
name = "nox-browser"
version = "0.7.4"
edition = "2021"
description = "A portable terminal-first web browser with responsive terminal layout rendering"
license = "MIT"

[[bin]]
name = "nox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "charset", "http2", "system-proxy", "cookies"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sha2 = "0.10"
url = "2.5.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
